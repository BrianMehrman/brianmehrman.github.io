baseURL = 'https://www.brianmehrman.com/'
locale = 'en-us'
title = 'Brian Mehrman'
theme = 'PaperMod'
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = 'production'
  title = 'Brian Mehrman'
  description = 'Platform Engineer · Architect · Mentor. Writing about systems that scale and engineers who grow.'
  keywords = ['platform engineering', 'architecture', 'kubernetes', 'mentorship', 'software engineering']
  author = 'Brian Mehrman'
  dateFormat = 'January 2, 2006'
  defaultTheme = 'dark'
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = 'Brian Mehrman'
    Content = 'Platform Engineer · Architect · Mentor'

  [params.profileMode]
    enabled = false

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/brianmehrman'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://linkedin.com/in/brianmehrman-208a1a1a'

  [[params.socialIcons]]
    name = 'rss'
    url = '/index.xml'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[[menus.main]]
  identifier = 'writing'
  name = 'Writing'
  url = '/blog/'
  weight = 10

[[menus.main]]
  identifier = 'portfolio'
  name = 'Portfolio'
  url = '/portfolio/'
  weight = 20

[[menus.main]]
  identifier = 'about'
  name = 'About'
  url = '/about/'
  weight = 30

[[menus.main]]
  identifier = 'resume'
  name = 'Resume'
  url = '/resume/'
  weight = 40

[markup]
  [markup.highlight]
    style = 'dracula'
    lineNos = false
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
