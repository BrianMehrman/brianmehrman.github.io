{{- define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
</header>
{{- range .RegularPages.GroupByDate "2006" }}
<section class="home-section">
  <h2>{{ if eq .Key (now.Format "2006") }}Recent writing{{ else }}Archive · {{ .Key }}{{ end }}</h2>
  {{- range .Pages }}
  <article class="post-entry">
    <header class="entry-header">
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    </header>
    <div class="entry-content"><p>{{ .Summary }}</p></div>
    <footer class="entry-footer"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time></footer>
  </article>
  {{- end }}
</section>
{{- end }}
{{- end }}
